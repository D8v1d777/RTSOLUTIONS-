name: RTSOLUTIONS CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - claude/fable-5-2-build

permissions:
  contents: read

concurrency:
  group: rtsolutions-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://rtsolutions-preview.onrender.com

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright suite
        run: npm run test -- --project=chromium

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: rtsolutions-playwright-evidence
          path: |
            playwright-report/
            test-results/
            docs/screenshots/
          if-no-files-found: ignore
          retention-days: 14
